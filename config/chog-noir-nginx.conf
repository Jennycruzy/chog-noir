server {
    listen 80;
    listen [::]:80;
    server_name chognoir.54-154-121-30.sslip.io;
    root /var/www/chog-noir;
    index index.html;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location /art/ {
        try_files $uri =404;
        expires 7d;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8311;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 8k;
    }
    location = /health { proxy_pass http://127.0.0.1:8311; }
    location = /api/health { proxy_pass http://127.0.0.1:8311; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
