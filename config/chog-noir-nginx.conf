server {
    listen 80;
    listen [::]:80;
    server_name chognoir.54-154-121-30.sslip.io;
    root /var/www/chog-noir;
    index index.html;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    location = /health { proxy_pass http://127.0.0.1:8311; }
    location = /api/health { proxy_pass http://127.0.0.1:8311; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}
