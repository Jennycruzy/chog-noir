name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test packages/core/test/*.test.mjs
      - run: node --check scripts/check-data.mjs
      - run: node --check scripts/mirror-art.mjs
      - run: node --check scripts/fetch-fixtures.mjs
